name: Test Task
description: Create a testing task for Pravaah
title: '[Test] '
labels: ['type: test']
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What test coverage or validation should be added?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the testing steps or coverage additions.
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know the testing work is complete?
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add test cases, frameworks, or risk notes.

name: Docs Task
description: Create a documentation task for Pravaah
title: '[Docs] '
labels: ['type: docs']
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What documentation needs to be added or updated?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the documentation changes needed.
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know the docs are complete?
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add links, source-of-truth notes, or context.

name: Research Task
description: Create a research task for Pravaah
title: '[Research] '
labels: ['type: research']
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What question or decision should this research answer?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the research actions to perform.
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know the research is complete?
      placeholder: |
        - [ ] Add item
        - [ ] Add item
        - [ ] Add item
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add links, comparisons, or final recommendations.

name: Setup Task
description: Create a setup or infrastructure task for Pravaah
title: '[Setup] '
labels: ['type: setup']
body:
    - type: textarea
      id: overview
      attributes:
          label: Overview
          description: What setup work needs to be completed?
      validations:
          required: true

    - type: textarea
      id: tasks
      attributes:
          label: Tasks
          description: List the setup steps that need to happen.
          placeholder: |
              - [ ] Add item
              - [ ] Add item
              - [ ] Add item
      validations:
          required: true

    - type: textarea
      id: acceptance-criteria
      attributes:
          label: Acceptance Criteria
          description: How will we know the setup is complete?
          placeholder: |
              - [ ] Add item
              - [ ] Add item
              - [ ] Add item
      validations:
          required: true

    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Add environment, tooling, or dependency notes.

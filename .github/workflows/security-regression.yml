name: Security regression

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    security-regression:
        name: Security and concurrency regression (PostgreSQL + XSS)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NODE_ENV: test
            SECURITY_TEST_MODE: '1'
            TEST_DATABASE_URL: postgresql://pravaah_test:pravaah_test@127.0.0.1:5432/pravaah_security_test
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: pravaah_test
                    POSTGRES_PASSWORD: pravaah_test
                    POSTGRES_DB: pravaah_security_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U pravaah_test -d pravaah_security_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - name: Install locked dependencies
              run: npm ci
            - name: Generate Prisma client
              run: npm run prisma:generate -w apps/server
              env:
                  DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
            - name: Apply committed migrations to isolated PostgreSQL
              id: migrate
              run: npm run security:migrate -w apps/server
            - name: Run backend security and concurrency integration suite
              id: backend
              run: npm run test:security -w apps/server
            - name: Run frontend XSS regression tests
              id: frontend
              run: npm run test -w apps/web -- src/features/patients/PatientsPage.test.tsx src/features/doctors/DoctorsPage.test.tsx src/features/appointments/AppointmentsPage.test.tsx src/components/ui/RiskExplanation.test.tsx
            - name: Summarize required checks
              if: always()
              run: |
                  echo '## Security regression' >> "$GITHUB_STEP_SUMMARY"
                  echo '- Migrations: ${{ steps.migrate.outcome }}' >> "$GITHUB_STEP_SUMMARY"
                  echo '- Backend: ${{ steps.backend.outcome }}' >> "$GITHUB_STEP_SUMMARY"
                  echo '- Frontend XSS: ${{ steps.frontend.outcome }}' >> "$GITHUB_STEP_SUMMARY"
